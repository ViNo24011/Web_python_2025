<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>createwarehouse</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/themify-icons@0.1.2/css/themify-icons.css">
    <link rel="stylesheet" href="./assets/css/create_warehouse.css">
</head>
<body>
    <div class="main">
        <div class="navbar">
            <a href="{% url 'users:home_page' %}" class="navbar__header">
                <p class="navbar__header-logo">Warehourse</p>
                <div class="navbar__header-wrapper">
                    <p class="navbar__header-text">Quản lý kho hàng</p>
                </div>
            </a>
            <div class="navbar__content">
                <div class="navbar__content-item">
                    <a href="{% url 'users:home_page' %}" class="navbar__content-item-link">
                        <i class="fa-solid fa-chart-pie navbar__content-icon"></i>
                        <p class="navbar__content-text">Thống kê</p>
                    </a>
                </div>

                <div class="navbar__content-item">
                    <a href="#" class="navbar__content-item-link">
                        <i class="fa-solid fa-user-group navbar__content-icon"></i>
                        <p class="navbar__content-text">Quản lý người dùng</p>
                    </a>
                </div>

                <div class="navbar__content-item">
                    <a href="{% url 'partners:customer_page' %}" class="navbar__content-item-link">
                        <i class="fa-solid fa-users navbar__content-icon"></i>
                        <p class="navbar__content-text">Quản lý khách hàng</p>
                    </a>
                </div>

                <div class="navbar__content-item">
                    <a href="{% url 'reports:revenue_page' %}" class="navbar__content-item-link">
                        <i class="fa-solid fa-hand-holding-dollar navbar__content-icon"></i>
                        <p class="navbar__content-text">Quản lý doanh thu</p>
                    </a>
                </div>

                <div class="navbar__content-item">
                    <a href="{% url 'inventory:warehouse_page' %}" class="navbar__content-item-link navbar__content-item-choose">
                        <i class="fa-solid fa-warehouse navbar__content-icon"></i>
                        <p class="navbar__content-text">Quản lý kho hàng</p>
                    </a>
                </div>

                <div class="navbar__content-item">
                    <div class="navbar__content-item-link  navbar__content-item-parent">
                        <i class="fa-solid fa-boxes-stacked navbar__content-icon"></i>
                        <p class="navbar__content-text">Quản lý sản phẩm</p>
                        <i class="fa-solid fa-angle-down navbar__content-sub-icon"></i>
                    </div>

                    <div class="navbar__content-sub">
                        <a href="{% url 'partners:supplier_page' %}" class="navbar__content-item-link">
                            <i class="fa-solid fa-truck-field navbar__content-icon"></i>
                            <p class="navbar__content-text">Nhà cung cấp</p>
                        </a>

                        <a href="{% url 'inventory:select_warehouse' %}" class="navbar__content-item-link">
                            <i class="fa-solid fa-box navbar__content-icon"></i>
                            <p class="navbar__content-text">Sản phẩm</p>
                        </a>
                    </div>
                </div>

                <div class="navbar__content-item">
                    <div class="navbar__content-item-link navbar__content-item-parent">
                        <i class="fa-solid fa-file-invoice-dollar navbar__content-icon"></i>
                        <p class="navbar__content-text">Quản lý nhập xuất</p>
                        <i class="fa-solid fa-angle-down navbar__content-sub-icon"></i>
                    </div>

                    <div class="navbar__content-sub">
                        <a href="{% url 'transactions:import_receipt_page' %}" class="navbar__content-item-link">
                            <i class="fa-solid fa-file-import fa-user-groug navbar__content-icon"></i>
                            <p class="navbar__content-text">Nhập hàng</p>
                        </a>

                        <a href="{% url 'transactions:export_receipt_page' %}" class="navbar__content-item-link">
                            <i class="fa-solid fa-file-export navbar__content-icon"></i>
                            <p class="navbar__content-text">Xuất hàng</p>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="content">
            <div class="content__navbar">
                <a href="" class="content__navbar-notify"><i class="fa-solid fa-bell content__navbar-notify-icon"></i></a>
                <div class="content__navbar-account">                   
                    <div class="content__navbar-account-name">
                        <div class="content_navbar-img-wrapper">
                            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTr3jhpAFYpzxx39DRuXIYxNPXc0zI5F6IiMQ&s" class="content__navbar-account-img">
                        </div>
                        <p class="content__navbar-account-text">{{ user.get_full_name|default:user.username }}</p>
                        <i class="fa-solid fa-chevron-down content__navbar-account-icon"></i>
                    </div>
                    <div class="content__navbar-account-sub">
                       <a href="{% url 'users:logout' %}" class="content__navbar-account-item">
                          <i class="fa-solid fa-right-from-bracket content__navbar-account-icon"></i>
                          <p class="content__navbar-account-text">Đăng xuất</p>
                        </a>
                    </div>
                </div>
            </div>

            <div class="content__wrapper">
                <div class="add js-add">
                    <div class="add__container js-add-container">
                        <header class="add__header">Thêm kho hàng</header>

                        <form action="/import" method="post" class="add__form">
                            <div class="add_import-infor">
                                <div class="add__warehouse-wrapper">
                                    <label for="aid" class="add__warehouse-text-wrapper">
                                        <p class="add__warehouse-compulsory">*</p>
                                        <p class="add__warehouse-text">Mã kho hàng</p>
                                    </label>
                                    <div class="add__warehouse-input-wrapper">
                                        <input id="aid" type="text" required placeholder="Nhập mã kho hàng" class="add__warehouse-input">
                                    </div>
                                </div>

                                <div class="add__warehouse-wrapper">
                                    <label for="aname" class="add__warehouse-text-wrapper">
                                        <p class="add__warehouse-compulsory">*</p>
                                        <p class="add__warehouse-text">Tên kho hàng</p>
                                    </label>
                                    <div class="add__warehouse-input-wrapper">
                                        <input id="aname" type="text" required placeholder="Nhập tên kho hàng" class="add__warehouse-input">
                                    </div>
                                </div>

                                <div class="add__warehouse-address">
                                    <label for="address" class="add__warehouse-text-wrapper">
                                        <p class="add__warehouse-compulsory">*</p>
                                        <p class="add__warehouse-text">Địa chỉ</p>
                                    </label>
                                    <div class="add__warehouse-input-wrapper">
                                        <textarea id="address" rows="4" cols="50" placeholder="Nhập địa chỉ" class="add__warehouse-address-input"></textarea>
                                    </div>
                                </div>
                            </div>

                            <div class="add__submit">
                                <button type="submit" class=add__submit-btn>
                                    <p class="add__submit-text">Lưu</p>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll(".navbar__content-item .navbar__content-item-parent").forEach((title, index) => {
            const key = "menuOpen" + index;
            const child = title.nextElementSibling;
            title.addEventListener("click", function() {
                const isOpen = child.style.display === "block";
                child.style.display = isOpen ? "none" : "block";
                this.classList.toggle("active", !isOpen);
                localStorage.setItem(key, !isOpen);
            })
            if (localStorage.getItem(key) === "true") {
                child.style.display = "block";
                title.classList.add("active");
            }
        })
    </script>
</body>
</html>
